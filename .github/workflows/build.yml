name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: lint
        run: ./gradlew ktlintCheck

      - name: build and test
        run: ./gradlew build

  native:
    name: native image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup GraalVM
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: "25"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: native image のビルド
        run: ./gradlew :server:nativeCompile

      # リフレクションの登録漏れはビルドでは分からないので、起動して CLI を一通り動かす
      - name: native image の起動確認
        run: |
          ./server/build/native/nativeCompile/service-account generate-signing-key > /dev/null
          ./server/build/native/nativeCompile/service-account generate-client-secret > /dev/null
          echo "native-image-smoke-test-password" | SERVICE_ACCOUNT_DATABASE_PATH="$RUNNER_TEMP/smoke.db" ./server/build/native/nativeCompile/service-account add-user smoke
