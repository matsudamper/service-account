syntax = "proto3";

package serviceaccount.v1;

option java_multiple_files = true;
option java_package = "net.matsudamper.serviceaccount.proto.v1";

// 呼び出し元のサービスはすべての RPC で次の metadata を付ける。
//   x-client-id: クライアント設定の id
//   authorization: Bearer <クライアントシークレット>
// 通らなければ UNAUTHENTICATED になる。
//
// ログインに通ると短命な JWT（ログイントークン）を返す。呼び出し元はそれを検証してユーザーを確かめ、
// ログイン状態は自分のセッションで持つ。ログイントークンの aud は発行を依頼したクライアントの id で、
// 別のクライアントでは通らない。

service AuthService {
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (LoginResponse);

  // allowCredentials を空にした PublicKeyCredentialRequestOptionsJSON を返す
  rpc CreatePasskeyLoginOptions(CreatePasskeyLoginOptionsRequest) returns (CreatePasskeyLoginOptionsResponse);

  rpc LoginWithPasskey(LoginWithPasskeyRequest) returns (LoginResponse);

  // 署名・発行者・期限・aud を確かめる。GetJwks の公開鍵で呼び出し元が検証してもよい
  rpc VerifyLoginToken(VerifyLoginTokenRequest) returns (VerifyLoginTokenResponse);

  rpc GetJwks(GetJwksRequest) returns (GetJwksResponse);
}

// 呼び出し元が自分のセッションで確かめたユーザーの user_id を渡す。
// 呼び出し元はクライアントシークレットで認証済みなので、その申告を信じる。ユーザーがいなければ NOT_FOUND になる
service AccountService {
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  // パスワードが無ければ追加になる
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // パスワードが既に無くても成功する
  rpc DeletePassword(DeletePasswordRequest) returns (DeletePasswordResponse);

  // PublicKeyCredentialCreationOptionsJSON を返す
  rpc CreatePasskeyRegistrationOptions(CreatePasskeyRegistrationOptionsRequest) returns (CreatePasskeyRegistrationOptionsResponse);

  rpc RegisterPasskey(RegisterPasskeyRequest) returns (RegisterPasskeyResponse);

  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);

  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);
}

message LoginToken {
  string token = 1;
  int64 expires_at_epoch_millis = 2;
}

message LoginWithPasswordRequest {
  string username = 1;
  string password = 2;
  // 総当たりの締め出しに使う、エンドユーザーの送信元 IP
  string client_ip = 3;
}

message LoginWithPasskeyRequest {
  // AuthenticationResponseJSON
  string credential_json = 1;
}

enum LoginFailure {
  LOGIN_FAILURE_UNSPECIFIED = 0;
  // ユーザーがいない、パスワードが違う、パスキーが通らない
  LOGIN_FAILURE_NOT_ACCEPTED = 1;
  // 送信元からの失敗が多すぎる
  LOGIN_FAILURE_TOO_MANY_ATTEMPTS = 2;
}

message LoginResponse {
  oneof result {
    LoginToken token = 1;
    LoginFailure failure = 2;
  }
}

message CreatePasskeyLoginOptionsRequest {}

message CreatePasskeyLoginOptionsResponse {
  string options_json = 1;
}

message VerifyLoginTokenRequest {
  string token = 1;
}

message AuthenticatedUser {
  int64 user_id = 1;
  string username = 2;
}

message VerifyLoginTokenResponse {
  // 通らなければ空
  optional AuthenticatedUser user = 1;
}

message GetJwksRequest {}

message GetJwksResponse {
  string jwks_json = 1;
}

message GetAccountRequest {
  int64 user_id = 1;
}

message GetAccountResponse {
  int64 user_id = 1;
  string username = 2;
  bool has_password = 3;
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string new_password = 2;
}

enum ChangePasswordError {
  CHANGE_PASSWORD_ERROR_UNSPECIFIED = 0;
  CHANGE_PASSWORD_ERROR_LENGTH = 1;
  CHANGE_PASSWORD_ERROR_INVALID_CHARACTER = 2;
}

message ChangePasswordResponse {
  // 空なら成功
  repeated ChangePasswordError errors = 1;
  // CHANGE_PASSWORD_ERROR_INVALID_CHARACTER の原因の文字
  string invalid_characters = 2;
}

message DeletePasswordRequest {
  int64 user_id = 1;
}

enum DeletePasswordResult {
  DELETE_PASSWORD_RESULT_UNSPECIFIED = 0;
  DELETE_PASSWORD_RESULT_SUCCESS = 1;
  // パスキーが無いので消すとログインできなくなる
  DELETE_PASSWORD_RESULT_NO_PASSKEY = 2;
}

message DeletePasswordResponse {
  DeletePasswordResult result = 1;
}

message CreatePasskeyRegistrationOptionsRequest {
  int64 user_id = 1;
}

message CreatePasskeyRegistrationOptionsResponse {
  string options_json = 1;
}

message RegisterPasskeyRequest {
  int64 user_id = 1;
  string name = 2;
  // RegistrationResponseJSON
  string credential_json = 3;
}

enum RegisterPasskeyResult {
  REGISTER_PASSKEY_RESULT_UNSPECIFIED = 0;
  REGISTER_PASSKEY_RESULT_SUCCESS = 1;
  REGISTER_PASSKEY_RESULT_NOT_ACCEPTED = 2;
  REGISTER_PASSKEY_RESULT_ALREADY_REGISTERED = 3;
  REGISTER_PASSKEY_RESULT_INVALID_NAME = 4;
}

message RegisterPasskeyResponse {
  RegisterPasskeyResult result = 1;
}

message Passkey {
  // credential ID の base64url（パディング無し）
  string id = 1;
  string name = 2;
  // 登録したクライアントの RP ID。この RP ID のクライアントからしかログインに使えない
  string rp_id = 3;
  int64 created_at_epoch_millis = 4;
  optional int64 last_used_at_epoch_millis = 5;
}

message ListPasskeysRequest {
  int64 user_id = 1;
}

message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

message DeletePasskeyRequest {
  int64 user_id = 1;
  string passkey_id = 2;
}

enum DeletePasskeyResult {
  DELETE_PASSKEY_RESULT_UNSPECIFIED = 0;
  DELETE_PASSKEY_RESULT_SUCCESS = 1;
  // ログイン中のユーザーのパスキーではない
  DELETE_PASSKEY_RESULT_NOT_FOUND = 2;
  // パスワードが無く、最後のパスキーなので消すとログインできなくなる
  DELETE_PASSKEY_RESULT_LAST_LOGIN_METHOD = 3;
}

message DeletePasskeyResponse {
  DeletePasskeyResult result = 1;
}
