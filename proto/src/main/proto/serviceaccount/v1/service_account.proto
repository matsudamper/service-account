syntax = "proto3";

package serviceaccount.v1;

option java_multiple_files = true;
option java_package = "net.matsudamper.serviceaccount.proto.v1";

// 各サービスのバックエンドだけが使う API。
// ログインとアカウントの操作は、ブラウザやアプリがこのサービスの HTTP（ログイン画面と REST）で直接行う。
//
// すべての RPC で次の metadata を付ける。通らなければ UNAUTHENTICATED になる。
//   x-client-id: 設定ファイルの clients[].id
//   authorization: Bearer <クライアントシークレット>
service AuthService {
  // Web のログイン画面から redirect_uri に戻ってきた認可コードを、ログイントークンに交換する
  rpc ExchangeAuthorizationCode(ExchangeAuthorizationCodeRequest) returns (ExchangeAuthorizationCodeResponse);

  // アプリが REST のログインで受け取ってバックエンドに渡したログイントークンを検証する。
  // 署名・発行者・期限・aud（呼び出し元のクライアント）を確かめる。GetJwks の公開鍵で自分で検証してもよい
  rpc VerifyLoginToken(VerifyLoginTokenRequest) returns (VerifyLoginTokenResponse);

  rpc GetJwks(GetJwksRequest) returns (GetJwksResponse);
}

// ログインしたユーザーを、aud のクライアントに伝える短命な JWT。
// 受け取ったら検証してすぐ自分のセッションを作り、保存しない
message LoginToken {
  string token = 1;
  int64 expires_at_epoch_millis = 2;
}

message ExchangeAuthorizationCodeRequest {
  string code = 1;
  // 認可のリクエストで渡したものと同じ値
  string redirect_uri = 2;
  // PKCE の code_verifier
  string code_verifier = 3;
}

message ExchangeAuthorizationCodeResponse {
  // 期限切れ・使用済み・別クライアントのコード、redirect_uri や code_verifier の不一致なら空
  optional LoginToken token = 1;
  optional AuthenticatedUser user = 2;
}

message VerifyLoginTokenRequest {
  string token = 1;
}

message AuthenticatedUser {
  int64 user_id = 1;
  string username = 2;
}

message VerifyLoginTokenResponse {
  // 通らなければ空
  optional AuthenticatedUser user = 1;
}

message GetJwksRequest {}

message GetJwksResponse {
  string jwks_json = 1;
}
